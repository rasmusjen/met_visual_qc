[project]
name = "met_visual_qc"
version = "0.2.0"
description = "CSV QC plotting tools and met_qc ingestion/plotting"
authors = [ { name = "" } ]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"pandas>=2.0",
	"plotly>=5.0",
	"pyyaml>=6.0",
	"click>=8.0",
		"pyarrow>=14.0",
]

[project.scripts]
met-visual-qc = "met_visual_qc.cli:main"
met-qc = "met_qc.cli:main"

[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"
